name: Capturas de ecrã
on:
  push:
    branches: [main]
    paths: ['ferramentas/captura.mjs']
permissions:
  contents: write
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright-core@1.49.1 >/dev/null
      - run: node ferramentas/captura.mjs || true
      - run: |
          git config user.name "captura"; git config user.email "captura@users.noreply.github.com"
          git checkout --orphan resultados-captura
          git rm -rfq --cached . >/dev/null
          git add saida-captura
          git commit -qm "Capturas"
          git push -f origin HEAD:resultados-captura
