name: Sonda de fontes
on:
  push:
    paths: ['ferramentas/sonda-pedido.txt']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar pedidos
        run: |
          mkdir -p saida
          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            curl -sS -L -m 40 -A "Mozilla/5.0 (Fonte Certa; pesquisa jurisprudencial)" -D "saida/$i.headers" -o "saida/$i.body" -w "$i %{http_code} %{time_total}s %{content_type} $url\n" "$url" >> saida/indice.txt 2>>saida/erros.txt || echo "$i ERRO $url" >> saida/indice.txt
          done < ferramentas/sonda-pedido.txt
      - name: Guardar resultados
        run: |
          git config user.name "sonda"; git config user.email "sonda@users.noreply.github.com"
          git checkout --orphan resultados-sonda
          git rm -rfq --cached . >/dev/null
          git add saida
          git commit -qm "Resultados da sonda"
          git push -f origin resultados-sonda
